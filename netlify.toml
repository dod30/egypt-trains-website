[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — every unknown path serves index.html so React Router can handle it client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache static hashed assets (Vite outputs filenames with hashes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache index.html so deploys take effect immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
